version: '3.8'

services:
  # 1. FastAPI Multi-Agent Backend Service
  researchbot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: researchbot:latest
    container_name: researchbot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REQUEST_TIMEOUT=60
    volumes:
      # Volume mount for development hot-reloading & data isolation
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - researchbot-network

  # 2. Streamlit Web UI Frontend Service
  researchbot-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: researchbot:latest
    container_name: researchbot-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://researchbot-api:8000
    volumes:
      # Mount frontend script for live updates
      - ./streamlit_app.py:/app/streamlit_app.py:ro
    depends_on:
      researchbot-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - researchbot-network

# Isolated Internal Bridge Network
networks:
  researchbot-network:
    driver: bridge
    name: researchbot-isolated-net
