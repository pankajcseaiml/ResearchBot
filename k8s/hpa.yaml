apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: researchbot-hpa
  labels:
    app.kubernetes.io/name: researchbot
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: genai-devops-coursework
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: researchbot-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
