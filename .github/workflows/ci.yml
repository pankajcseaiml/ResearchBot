name: ResearchBot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  docker-build:
    name: Build & Validate Container Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: researchbot:ci-test

  k8s-validate:
    name: Validate Kubernetes & Helm Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kustomize Manifests
        run: |
          kubectl kustomize k8s/ > /dev/null
          echo "Kubernetes manifests compiled successfully via Kustomize."

      - name: Lint Helm Chart
        run: |
          helm lint helm/researchbot
          echo "Helm chart lint passed successfully."
